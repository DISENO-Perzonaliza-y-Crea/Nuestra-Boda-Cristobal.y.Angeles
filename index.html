    <script>
        let isPlaying = false;
        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('musicIcon');

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicIcon.className = "fa-solid fa-play text-xl translate-x-0.5";
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicIcon.className = "fa-solid fa-pause text-xl";
                    isPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked by browser policy:", e);
                });
            }
        }

        // Auto-play music on first user interaction anywhere on screen
        document.body.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    musicIcon.className = "fa-solid fa-pause text-xl";
                    isPlaying = true;
                }).catch(e => {});
            }
            document.body.removeEventListener('click', initAudio);
        }, { once: true });

        // Countdown Timer Logic (Target Date: November 21, 2026)
        const weddingDate = new Date("November 21, 2026 15:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<div class='col-span-4 text-center font-bold text-[#6b1d2f] text-sm'>¡Llegó el gran día!</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
